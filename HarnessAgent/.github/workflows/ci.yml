name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 【2026-10 / 邝随行】此前仓库里**没有任何** CI —— app/build.gradle.kts 的注释
# 与 docs/03 里提到的 ci.yml「模型红线」步骤其实从未存在，属于文档漂移。
# 本文件把它补上，并新增 PR 必过的架构守卫。
#
# 打包一律 --no-daemon：本工程 JVM 参数较大，daemon 在 CI 与本机都会崩。

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 架构守卫：跨层依赖边由人工摘除（:ui → :agent/:mcp/:data），
  # 没有机器校验就会被「编译不过就加回去」悄悄还原 ⇒ 每次 PR 必跑。
  # 规则本体在根 build.gradle.kts 的 checkModuleDependencies（白名单 + import 黑名单）。
  # ───────────────────────────────────────────────────────────────────────────
  arch-guard:
    name: 架构守卫 · 依赖边
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      # 根 build.gradle.kts 定义任务，仍需配置 Android 模块 ⇒ 必须有 SDK
      - name: checkModuleDependencies
        run: ./gradlew checkModuleDependencies --no-daemon --console=plain

  # ───────────────────────────────────────────────────────────────────────────
  # 单测（11 模块 / 265 用例）
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: 单测
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: ./gradlew test
        run: ./gradlew test --no-daemon --console=plain -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1024m"

  # ───────────────────────────────────────────────────────────────────────────
  # R8 冒烟：2026-10 首次跑 release 才发现 R8 从来没被执行过，且一跑就挂
  #   （android.nonFinalResIds=false 与 optimized resource shrinking 冲突）。
  #   debug 全绿完全掩盖它 ⇒ 这里固定跑一次，并断言 mapping.txt 真的产出了。
  #   签名不在此处要求：无 Secret 时出 unsigned 包，签名校验由 release 工作流兜底。
  # ───────────────────────────────────────────────────────────────────────────
  release-r8:
    name: R8 冒烟 · release 变体
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: ./gradlew assembleRelease
        run: ./gradlew assembleRelease --no-daemon --console=plain -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1024m"
      - name: 断言 R8 真的执行了（mapping.txt 存在且非空）
        run: |
          test -s app/build/outputs/mapping/release/mapping.txt \
            || { echo "::error::mapping.txt 缺失 —— R8 可能未执行"; exit 1; }
          echo "OK: mapping.txt $(du -h app/build/outputs/mapping/release/mapping.txt | cut -f1)"

  # ───────────────────────────────────────────────────────────────────────────
  # 模型红线：Gemma 4 E2B 权重（约 2.6GB）不得随包分发，只能靠下载服务拉取。
  # 这里不打包、不跑 Gradle —— 纯文件系统断言，秒级出结果。
  # ───────────────────────────────────────────────────────────────────────────
  model-redline:
    name: 模型红线 · 权重不随包
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: assets / jniLibs 内不得出现权重文件
        run: |
          hits=$(find . \( -path '*/src/main/assets/*' -o -path '*/src/main/jniLibs/*' \) -type f \
                \( -name '*.task' -o -name '*.litertlm' -o -name '*.bin' \
                   -o -name '*.tflite' -o -name '*.gguf' -o -name '*.safetensors' \) -print)
          if [ -n "$hits" ]; then
            echo "::error::包内发现端侧权重，红线（见 app/build.gradle.kts 头部说明）:"
            echo "$hits"
            exit 1
          fi
          echo "OK: 无权重文件随包"

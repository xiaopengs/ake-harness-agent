# ── JVM / Gradle
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=false

# ── Kotlin
kotlin.code.style=official
kotlin.incremental.useClasspathSnapshot=true
# 端侧推理对 null 安全极敏感：本项目禁止平台类型静默通过
kotlin.jsr305=strict

# ── Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
# 只用需要的资源，压包体与构建时间
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=false

# ── Project config（minSdk 28 ⇒ 覆盖 95%+ 在役设备；对齐数据库文档 F6）
ake.compileSdk=36
ake.targetSdk=36
ake.minSdk=28
ake.versionCode=1
ake.versionName=0.1.0-dev
ake.applicationId=com.ake.harnessagent

# ── JVM / Gradle
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=false

# ── Kotlin
kotlin.code.style=official
kotlin.incremental.useClasspathSnapshot=true
# 端侧推理对 null 安全极敏感：本项目禁止平台类型静默通过
kotlin.jsr305=strict

# ── Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
# 只用需要的资源，压包体与构建时间
android.defaults.buildfeatures.buildconfig=false
# ★ 2026-10 实测（邝随行）：这里原本写 false，release 一跑 R8 就硬失败
#   "Optimized resource shrinking requires non-final IDs" —— debug 从不出这个错，
#   只有 minify+shrinkResources 同时开才触发，所以此前一直没暴露。
#   true 是 AGP 8+ 的默认值与非 final R 的方向；全仓检索确认无
#   `when (R.id.x)` / 注解里引用 R 常量等依赖 final id 的写法 ⇒ 可安全切换。
android.nonFinalResIds=true

# ── Project config（minSdk 28 ⇒ 覆盖 95%+ 在役设备；对齐数据库文档 F6）
ake.compileSdk=36
ake.targetSdk=36
ake.minSdk=28
ake.versionCode=1
ake.versionName=0.1.0-dev
ake.applicationId=com.ake.harnessagent

# ── Phase 3 / 韩渡川：发布开关 ──────────────────────────────────────────────
# ABI 分包（arm64-v8a + x86_64 + 一个 universal 包）。
# 默认 false ⇒ 本地与 CI 固定产出单个 universal APK，产物路径稳定好定位。
# 发布必须显式带 -Pake.abiSplit=true（release.yml 已带）。
# 可发布版本还应覆盖 versionCode/versionName：
#   ./gradlew :app:assembleRelease -Pake.abiSplit=true -Pake.versionCode=2 -Pake.versionName=0.1.0
ake.abiSplit=false

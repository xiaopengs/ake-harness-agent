# ─────────────────────────────────────────────────────────────────────────────
# 【本轮 · 苏映棠】Robolectric 的全局配置（:ui 模块）
#
# 为什么用这个文件而不是在测试类上写 `@Config(sdk = [36])`：
#   `src/androidTest/java` 下的 4 个测试类是 **unitTest 与 androidTest 两个源集共用**
#   的一份源码（见 ui/build.gradle.kts 里 `sourceSets` 那段注释）。而 `@Config` 来自
#   `org.robolectric` —— 为了在 unitTest 侧写它，就得把 robolectric 也加进
#   androidTest 依赖，等于为一个"只在 JVM 上生效"的注解污染真机侧的配置。
#   放在这里只影响 JVM 单测，真机侧完全看不见。
#
# ---------------------------------------------------------------------------
# ⚠ 最终值是 35，不是模块 compileSdk 的 36 —— 原因是硬性的，不是偷懒：
#   Robolectric 4.17 的 DefaultSdkProvider 对 SDK 36 要求 **Java 21**，而本机只有
#   Zulu JDK 20（实测 `./gradlew -q javaToolchains` 只检测到 20）。实测报错原文：
#       UnsupportedOperationException: Failed to create a Robolectric sandbox:
#       Android SDK 36 requires Java 21 (have Java 20)
#   SDK 35 只要求 Java 17 ⇒ 20 达标，能跑。
#
#   ★ 代价必须写清楚：这 15 条跑在 **Android 15 的 shadow** 上，不是 16。
#     它们断言的是 Compose 语义树（置灰 / 可见性 / 文案 / 相对布局位置），
#     不依赖 15→16 的行为差异；但这句注释得留着 —— 将来本机上到 JDK 21 时应改回 36，
#     且改回 36 后若有某条变红，第一嫌疑是 15→16 的行为差异，而不是"测试本来就脆"。
# ---------------------------------------------------------------------------
sdk=35
